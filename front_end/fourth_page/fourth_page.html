<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hire | Single Resume Screening</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/fourth_page/fourth_page.css">
</head>
<body>

  <header class="header">
    <img src="/fourth_page/logo1.png" class="logo" alt="Smart Hire Logo">
  </header>

  <section class="screening-container">
    <h1 class="title">AI Interview Assistant</h1>

    <div class="form-group">
      <label>Job Title</label>
      <input type="text" placeholder="Enter job title">
    </div>

    <div class="form-group">
      <label>Job Description</label>
      <textarea class="jd-box" placeholder="Enter job description"></textarea>
    </div>

    <div class="form-group">
      <label>Skills Required</label>
      <textarea class="skills-box" placeholder="Enter required skills"></textarea>
    </div>

    <div class="form-group extra-bottom-space">
      <label>Upload Resume (PDF Only)</label>
      <input type="file" id="resumeUpload" accept="application/pdf">
    </div>

    <div class="btn-center">
      <button class="start-btn">Set Up Interview</button>
    </div>
  </section>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.15.349/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.15.349/pdf.worker.min.js";
  </script>

  <script src="/fourth_page/fourth_page.js"></script>
</body>
</html>
