<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interview Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/result_page/result_page.css">
</head>
<body>

  <div class="results-container">
    <h1>📊 Interview Analysis</h1>

    <div class="score-box">
      <h2 id="finalScore">Score: --</h2>
      <h3 id="recommendation"></h3>
    </div>

    <div class="summary">
      <h3>Overall Summary</h3>
      <p id="summaryText"></p>
    </div>

    <div class="suggestions">
      <h3>Improvement Suggestions</h3>
      <ul id="suggestionsList"></ul>
    </div>

    <div class="evaluations">
      <h3>Question-wise Evaluation</h3>
      <div id="evaluationCards"></div>
    </div>

  </div>

  <script src="/result_page/result_page.js"></script>
</body>
</html>
