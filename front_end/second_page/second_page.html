<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Hire | Candidate Screening</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="second_page.css">
</head>
<body>

  <header class="header">
    <img src="logo1.png" class="logo" alt="Smart Hire Logo">
  </header>

  <section class="screening-container">
    <h1 class="title">Candidate Screening</h1>

    <div class="form-group">
      <label>Job Title</label>
      <input type="text" placeholder="Enter job title">
    </div>

    <div class="form-group">
      <label>Skills Required</label>
      <textarea class="skills-box" placeholder="Enter required skills"></textarea>
    </div>

    <div class="form-group">
      <label>Number of Positions</label>
      <input type="number" placeholder="Enter number of positions (<=Resumes)">
    </div>

    <div class="form-group extra-bottom-space">
      <label>Upload Resumes</label>
      <input type="file" multiple>
    </div>

    <div class="btn-center">
      <button class="start-btn">Start Screening</button>
    </div>

    <div class="results-container"></div>
  </section>

  <!-- PDF.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.15.349/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.15.349/pdf.worker.min.js";
  pdfjsLib.GlobalWorkerOptions.useWorkerFetch = true; // ✅ Fixes font warnings
</script>


  <script src="second_page.js"></script>
</body>
</html>
